[package]
name = "pepakura-desktop"
version = "0.1.0"
description = "Pepakura Next - Desktop Application"
authors = ["you@example.com"]
license = "MIT"
repository = ""
default-run = "pepakura-desktop"
edition = "2021"
rust-version = "1.70"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.0.0", features = [] }
pepakura-core = { path = "../../core" }
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1", features = ["full"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-fs = { version = "2.0.0", features = [] }
tauri-plugin-dialog = { version = "2.0.0", features = [] }
tauri-plugin-shell = { version = "2.0.0", features = [] }

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
