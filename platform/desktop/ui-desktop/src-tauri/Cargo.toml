[package]
name = "pepakura-desktop"
version = "0.1.0"
description = "Pepakura Next - Desktop Application"
authors = ["Pepakura Next Team"]
license = "MIT"
repository = "https://github.com/pepakura-next/pepakura-next"
default-run = "pepakura-desktop"
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "2.3.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.3.5", features = [] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
thiserror = "1.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
dashmap = "5.5"
gltf = "1.0"

# Pepakura Core
pepakura_core = { path = "../../../../crates/pepakura_core", features = ["svg", "pdf", "dxf", "llm"] }
pepakura_platform = { path = "../../../../crates/pepakura_platform" }
ai_bridge = { path = "../../../../crates/ai_bridge" }

# Tauri plugins
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-fs = { version = "2.3.5", features = [] }
tauri-plugin-dialog = { version = "2.3.5", features = [] }
tauri-plugin-shell = { version = "2.3.5", features = [] }
tauri-plugin-store = "2.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
