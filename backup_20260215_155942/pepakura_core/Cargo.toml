[package]
name = "pepakura_core"
version = "0.1.0"
edition = "2021"

[dependencies]
byteorder = "1.4"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.0", optional = true }
flate2 = "1.0"

[features]
default = ["tauri-api"]
tauri-api = ["dep:tauri"]

[lib]
name = "pepakura_core"
path = "src/lib.rs"
