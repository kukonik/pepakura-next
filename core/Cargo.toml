[package]
name = "pepakura-core"
version = "0.1.0"
edition = "2021"

[dependencies]
# Для работы с 3D моделями
obj = "0.10"

# Для математических операций
nalgebra = "0.32"

# Для сериализации/десериализации
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Для логирования
log = "0.4"
env_logger = "0.10"

# Для работы с изображениями (для экспорта в PNG/JPG)
image = "0.24"

# Для работы с SVG
svg = "0.13"

[lib]
name = "pepakura_core"
path = "src/lib.rs"