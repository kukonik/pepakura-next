[package]
name = "pepakura_core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
log = "0.4"
nalgebra = "0.32"
rustc-hash = "1.1"

# Для работы с 3D моделями
obj = "0.10"

# Для работы с изображениями (для экспорта в PNG/JPG)
image = "0.24"

# Для работы с SVG
svg = { version = "0.13", optional = true }

# Для работы с PDF (только для native)
printpdf = { version = "0.6", optional = true }

# Для работы с DXF (только для native)
dxf = { version = "0.5", optional = true }

# WASM поддержка
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", features = ["console"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }

[dev-dependencies]
criterion = "0.5"
rand = "0.8"
tempfile = "3.3"

[lib]
name = "pepakura_core"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["svg", "pdf"]
wasm = ["wasm-bindgen", "js-sys", "web-sys"]
svg = ["dep:svg"]
pdf = ["dep:printpdf"]
dxf = ["dep:dxf"]