[package]
name = "pepakura_core"
version = "0.1.0"
edition = "2021"
description = "Ядро для генерации развёрток бумажных моделей (papercraft)"
authors = ["Pepakura Next Team"]
license = "MIT"
repository = "https://github.com/pepakura-next/pepakura-next"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["sqlite", "native", "llm"]
sqlite = ["rusqlite"]
native = ["reqwest", "tokio", "tokio-stream", "parallel"]
wasm = ["wasm-bindgen", "js-sys", "web-sys"]
parallel = ["rayon"]
llm = ["ureq"]
svg = ["dep:svg"]
pdf = ["dep:printpdf"]
dxf = ["dep:dxf"]

[dependencies]
# Сериализация
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Обработка ошибок
thiserror = "1.0"

# Логирование
log = "0.4"

# Линейная алгебра для геометрии
nalgebra = "0.32"

# Быстрые хеш-мапы
rustc-hash = "1.1"

# Для работы с 3D моделями (OBJ)
obj = "0.10"

# Для оптимизации мешей (упрощение)
meshopt = "0.2"

# Для работы с изображениями
image = "0.24"

# Для работы с SVG
svg = { version = "0.13", optional = true }

# Для работы с PDF
printpdf = { version = "0.6", optional = true }

# Для работы с DXF
dxf = { version = "0.5", optional = true }

# Для работы с UUID
uuid = { version = "0.8", features = ["v4"] }

# Для работы с байтами
byteorder = "1.4"
flate2 = "1.0"

# Параллелизм
rayon = { version = "1.8", optional = true }

# Для генетического алгоритма
rand = "0.8"

# Для работы с датой
chrono = { version = "0.4", features = ["serde"] }

# Кэширование
lru = "0.12"
sha2 = "0.10"

# Стриминг
futures = "0.3"

# Platform абстракции
pepakura_platform = { path = "../pepakura_platform" }

# Опциональные зависимости
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
reqwest = { version = "0.11", features = ["json"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tokio-stream = { version = "0.1", optional = true }

# LLM-зависимости (синхронный HTTP для простоты)
ureq = { version = "2", features = ["json"], optional = true }

# WASM зависимости (optional для фичи wasm)
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", features = ["console"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
gloo-timers = { version = "0.3", features = ["futures"] }
getrandom = { version = "0.2", features = ["js"] }
chrono = { version = "0.4", features = ["serde", "wasmbind"] }
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }