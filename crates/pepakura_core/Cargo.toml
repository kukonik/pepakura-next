[package]
name = "pepakura_core"
version = "0.2.0"
edition = "2021"

[features]
default = ["native"]
native = ["meshopt"]
wasm = []
llm = []
dxf = []
pdf = []

[dependencies]
pepakura_platform = { path = "../pepakura_platform" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
log = "0.4"

# meshopt компилируется только для нативной сборки (Tauri)
meshopt = { version = "0.3", optional = true }
rayon = "1.12.0"
nalgebra.workspace = true
image.workspace = true
lru = "0.18.0"
sha2 = "0.11.0"
futures.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-stream = "0.1.18"
flate2 = "1.1.9"
byteorder = "1.5.0"
rand = "0.8"
chrono = "0.4.44"
obj = "0.10.2"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
rusqlite = { version = "0.29.0", features = ["bundled"] }
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
env_logger = "0.10"

