[package]
name = "pepakura_platform"
version = "0.1.0"
edition = "2021"
description = "Platform abstractions for Pepakura Core (FileSystem, Network, etc.)"
authors = ["Pepakura Next Team"]
license = "MIT"
repository = "https://github.com/pepakura-next/pepakura-next"

[lib]
crate-type = ["rlib"]

[features]
default = ["native"]
native = []
web = ["wasm-bindgen", "js-sys", "web-sys"]

[dependencies]
# Core errors
thiserror = "1.0"
anyhow = "1.0"

# Serialization for storage
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }

# WASM dependencies
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "Blob", "File", "FileReader", "Url", "console", "Storage"], optional = true }

# For bytes handling
bytes = "1.5"

# Native filesystem (only for native target)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["full"] }
