[package]
name = "pepakura_debug"
version = "0.1.0"
edition = "2021"
description = "CLI-утилита для отладки и анализа 3D моделей Pepakura"
authors = ["Pepakura Next Team"]
license = "MIT"

[[bin]]
name = "pepakura-debug"
path = "src/main.rs"

[dependencies]
# Pepakura Core с LLM-фичей
pepakura_core = { path = "../pepakura_core", features = ["llm"] }

# CLI
clap = { version = "4.4", features = ["derive"] }

# Логирование
env_logger = "0.10"
log = "0.4"

# Обработка ошибок
thiserror = "1.0"

# Сериализация
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Для работы с файлами
obj = "0.10"
