[package]
name = "example-rust-addon"
version = "0.1.0"
edition = "2021"
description = "Example Rust addon for Pepakura Next"

[lib]
crate-type = ["rlib"]

[dependencies]
pepakura_addons = { path = "../../crates/pepakura_addons" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
